[project]
name = "sentinelai-backend"
version = "0.1.0"
description = "SentinelAI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "anthropic>=0.39",
    "openai>=1.50",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "pytest-asyncio>=0.23"]
# Figure generation for the evaluation chapter (eval/notebooks/generate_figures.py).
viz = ["matplotlib>=3.8", "pandas>=2.1"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic revision files are autogenerated; don't lint their import/style.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "UP017", "B008",]  # keep (str, Enum) + timezone.utc for 3.10 dev

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
